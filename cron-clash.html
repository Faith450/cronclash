<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="src/output.css">
  <title>Cron Clash</title>
</head>
<body class="bg-zinc-950 dark:bg-zinc-950 text-slate-800 dark:text-zinc-100 min-h-screen transition-colors duration-200">
  <header class="border-b border-slate-200 dark:border-zinc-800/80 bg-white/50 dark:bg-zinc-900/50 backdrop-blur-sm">
    <section class="max-w-7xl mx-auto flex flex-col items-center sm:flex-row sm:justify-between p-4 gap-3">

<img src="images/image2.png" width="80" height="80" alt="Cron Clash logo" class="logo-light h-16 w-16 sm:h-20 sm:w-20 object-contain">
<img src="images/image.png" width="80" height="80" alt="Cron Clash logo" class="logo-dark h-16 w-16 sm:h-20 sm:w-20 object-contain">

 <p class="text-xs sm:text-sm font-semibold tracking-widest uppercase text-slate-500 dark:text-zinc-400 text-center">
        local &bull; private &bull; secure
      </p>
    </section>
  </header>

  <main class="max-w-7xl mx-auto p-4 sm:p-6">
    <section class="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl shadow-sm dark:shadow-2xl overflow-hidden transition-colors">
      <div class="p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">

        
        <div class="flex flex-col gap-4">
          <form class="flex flex-col gap-3">
            <input 
              name="task"
              type="text" 
              placeholder="e.g., Run Database Backup"
              class="w-full py-2.5 px-3 bg-slate-100 dark:bg-zinc-950 text-slate-900 dark:text-zinc-100 placeholder-slate-400 dark:placeholder-zinc-500 border border-slate-300 dark:border-zinc-800 rounded-xl outline-none focus:border-blue-500 dark:focus:border-blue-500 text-sm transition-all input-text"
            />

            <div class="flex gap-2">
              <input 
                name="cron"
                type="text" 
                placeholder="e.g., 0 12 * * *"
                class="flex-1 py-2.5 px-3 bg-slate-100 dark:bg-zinc-950 text-slate-900 dark:text-zinc-100 placeholder-slate-400 dark:placeholder-zinc-500 border border-slate-300 dark:border-zinc-800 rounded-xl outline-none focus:border-blue-500 dark:focus:border-blue-500 text-sm font-mono transition-all input-cron"
              />

              <button type="submit" class="h-10 w-10 flex items-center justify-center shrink-0 rounded-xl bg-slate-900 hover:bg-slate-800 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-white dark:text-zinc-200 transition-colors shadow-sm" title="Add or update task">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/>
                  <line x1="12" x2="12" y1="8" y2="16"/>
                  <line x1="8" x2="16" y1="12" y2="12"/>
                </svg>
              </button>
            </div>
          </form>

          
          <div class="input-list grid grid-cols-1 max-h-72 overflow-y-auto bg-slate-50 dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800/80 rounded-xl divide-y divide-slate-200 dark:divide-zinc-800/60">
          </div>
        </div>

        
        <div class="flex flex-col gap-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <h1 class="font-semibold text-slate-900 dark:text-zinc-100 text-lg sm:text-xl">Schedule Radar</h1>
            
            <div class="inline-flex items-center p-1 bg-slate-100 dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800 rounded-xl gap-1 self-start sm:self-auto">
              <button class="text-xs font-medium text-slate-600 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-white px-3 py-1 rounded-lg transition-colors">60 mins</button>
              <button class="text-xs font-medium text-white bg-blue-600 shadow-sm px-3 py-1 rounded-lg transition-all">24 hours</button>
              <button class="text-xs font-medium text-slate-600 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-white px-3 py-1 rounded-lg transition-colors">7 days</button>
            </div>
          </div>

          
          <div id="collision-alert-card" class="rounded-xl p-4 border transition-colors">
            <p id="collision-alert-title" class="font-medium text-sm flex items-center gap-2">
              <span id="collision-status-dot" class="h-2 w-2 rounded-full"></span>
              Status: Checking...
            </p>
            <p id="collision-alert-message" class="text-xs mt-1">
              Analyzing scheduled items...
            </p>
          </div>

          
          <div class="flex flex-col gap-3 p-4 rounded-xl bg-slate-50 dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800/80 w-full overflow-x-auto">
            <div class="min-w-[300px]">
              <div class="flex items-center gap-4 text-xs font-mono text-slate-500 dark:text-zinc-400 mb-2">
                <div class="w-24 sm:w-28 shrink-0 font-sans font-medium text-slate-700 dark:text-zinc-300">Task Name</div>
                <div class="relative flex-1 flex justify-between px-1">
                  <span>00:00</span>
                  <span>06:00</span>
                  <span>12:00</span>
                  <span>18:00</span>
                  <span>24:00</span>
                </div>
              </div>

              <hr class="border-slate-200 dark:border-zinc-800/80 mb-3" />

              
              <ul class="task-tracks-list flex flex-col gap-2.5">
              </ul>
            </div>
          </div>
        </div>

      </div>
    </section>
  </main>

  <script src="cron-clash.js"></script>
</body>
</html>
